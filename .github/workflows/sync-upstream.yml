name: Sync upstream

on:
  schedule:
    # Daily trigger at 08:17 Asia/Shanghai; the gate below checks upstream every 48 hours.
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'euking18/nodewarden'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Sync fork from shuaiplus/nodewarden
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            epoch_day=$(( $(date -u +%s) / 86400 ))
            anchor_day=20759 # 2026-11-02 UTC
            if (( epoch_day <= anchor_day || (epoch_day - anchor_day) % 2 != 0 )); then
              {
                echo '## Upstream sync'
                echo 'Skipped: today is outside the 48-hour synchronization cycle.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=main > "$RUNNER_TEMP/upstream-sync.json"; then
            echo "::error::Upstream sync failed. Resolve merge conflicts or use Sync fork manually if upstream workflow changes require additional authorization."
            exit 1
          fi
          cat "$RUNNER_TEMP/upstream-sync.json"
          {
            echo '## Upstream sync'
            echo 'Upstream: shuaiplus/nodewarden:main'
            jq -r '.message' "$RUNNER_TEMP/upstream-sync.json"
          } >> "$GITHUB_STEP_SUMMARY"
